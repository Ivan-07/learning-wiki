<h1>认知负荷理论与教学设计</h1>
<p>认知负荷理论认为，工作记忆的容量有限，学习材料的呈现方式会显著影响学习效果。内在负荷由材料本身的复杂度决定，外在负荷由糟糕的设计引入，相关负荷则是有助于图式建构的有效投入。</p>
<p>教学设计的核心目标因此是降低外在负荷、管理内在负荷、最大化相关负荷。例如，把图和对应的文字说明放在一起，比分开呈现更能减少学习者为建立关联而付出的无关认知 effort。</p>
<p>对自学者而言，这一理论的直接推论是：不要同时引入过多新概念。先在少数核心概念上建立稳定的心理模型，再逐步扩展，比一次性铺开大量术语更有效。</p>
