<h1>对认知负荷理论的批评</h1>
<p>认知负荷理论长期依赖主观负荷量表，测量基础受到质疑。批评者指出，许多支持该理论的实验效应量在控制了任务时长后明显缩小，且理论中的三类负荷在实践中难以区分。</p>
<p>另一条批评线索是生态效度：实验室中的学习任务与真实课堂差异巨大，基于简化任务得出的设计原则未必能迁移。</p>
<p>本页与《认知负荷理论与教学设计》一文结论存在冲突：后者认为降低外在负荷是教学设计的核心目标，本文认为该结论的证据基础薄弱。</p>
</article>
